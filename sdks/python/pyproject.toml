[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pilotfish"
dynamic = ["version"]
description = "Run browser tasks in pilotfish's cloud from Python, or drive Chrome on your own machine."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "gAI Ventures" }]
keywords = ["browser automation", "browser agent", "mcp", "web automation", "ai agent"]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://pilotfish.gai.ventures/docs/sdk"
Documentation = "https://pilotfish.gai.ventures/docs/sdk"
Source = "https://github.com/gAI-ventures/pilotfish-ai/tree/main/sdks/python"
Issues = "https://github.com/gAI-ventures/pilotfish-ai/issues"

[tool.hatch.version]
path = "src/pilotfish/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pilotfish"]

[tool.hatch.build.targets.sdist]
include = ["src/pilotfish", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
