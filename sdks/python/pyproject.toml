[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pilotfish-ai"
dynamic = ["version"]
description = "Browser automation SDK for Python: run AI browser-agent tasks in pilotfish's cloud, or drive Chrome on your own machine."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "gAI Ventures" }]
keywords = ["browser automation", "browser agent", "web agent", "ai browser", "web automation", "web scraping", "mcp", "playwright", "llm", "ai agent"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://pilotfish.gai.ventures/docs/sdk"
Documentation = "https://pilotfish.gai.ventures/docs/sdk"
Source = "https://github.com/gAI-ventures/pilotfish-ai/tree/main/sdks/python"
Issues = "https://github.com/gAI-ventures/pilotfish-ai/issues"
Changelog = "https://github.com/gAI-ventures/pilotfish-ai/releases"
Benchmarks = "https://pilotfish.gai.ventures/benchmarks"

[tool.hatch.version]
path = "src/pilotfish/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pilotfish"]

[tool.hatch.build.targets.sdist]
include = ["src/pilotfish", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
