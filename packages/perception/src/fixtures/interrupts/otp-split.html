<!doctype html><html><head><meta charset="utf-8"><title>Verify your identity</title>
<style>.boxes{display:flex;gap:8px}.boxes input{width:40px;height:48px;text-align:center;font-size:24px}</style></head>
<body><main style="width:420px;margin:60px auto">
<h1>Enter verification code</h1>
<p>Enter the 6-digit code we sent to <strong>•••1234</strong>. It expires in 10 minutes.</p>
<form action="/verify" method="post">
  <div class="boxes">
    <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 1" autocomplete="off">
    <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" autocomplete="off">
    <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" autocomplete="off">
    <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" autocomplete="off">
    <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" autocomplete="off">
    <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" autocomplete="off">
  </div>
  <button type="submit">Verify</button>
</form>
<p>Didn't get it? <a href="/resend">Resend code</a></p>
</main></body></html>
