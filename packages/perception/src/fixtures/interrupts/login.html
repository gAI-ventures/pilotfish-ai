<!doctype html><html><head><meta charset="utf-8"><title>Sign in · Acme</title>
<style>body{font-family:sans-serif;margin:0}main{width:340px;margin:60px auto}input{display:block;width:100%;margin:6px 0 14px;padding:6px}footer{margin-top:40px;text-align:center}footer a{margin:0 6px}</style></head>
<body><main>
<h1>Sign in to Acme</h1>
<form action="/session" method="post">
  <label for="login">Username or email address</label>
  <input id="login" name="login" type="text" autocomplete="username" autocapitalize="off">
  <label for="password">Password</label> <a href="/password_reset">Forgot password?</a>
  <input id="password" name="password" type="password" autocomplete="current-password">
  <input type="hidden" name="authenticity_token" value="abc">
  <button type="submit">Sign in</button>
</form>
<p>New to Acme? <a href="/signup">Create an account</a></p>
</main>
<footer><a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/docs">Docs</a><a href="/contact">Contact</a></footer>
</body></html>
